<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:2048px;height:1152px;overflow:hidden;background:#0b0b0d}
.wrap{width:2048px;height:1152px;position:relative;font-family:"Arial Black",Impact,sans-serif;
  background:radial-gradient(ellipse 900px 300px at 50% 50%, rgba(198,255,61,.14), rgba(11,11,13,0) 70%), #0b0b0d}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse 1100px 420px at 50% 50%,#000 30%,transparent 75%)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.word{display:flex;align-items:flex-end;color:#f2f2f2;font-size:170px;line-height:1;letter-spacing:4px}
.word span{display:block}
.word svg{margin:0 6px 0;}
.gap{width:54px}
.tag{margin-top:26px;color:#9a9aa2;font-family:"Segoe UI",Arial,sans-serif;font-weight:700;font-size:28px;letter-spacing:12px}
.tag b{color:#c6ff3d;font-weight:700}
.rule{width:120px;height:4px;background:#c6ff3d;margin-top:22px;border-radius:2px}
.pillars{position:absolute;top:50%;transform:translateY(-50%);color:#3a3a40;font-family:"Segoe UI",Arial,sans-serif;font-weight:700;font-size:22px;letter-spacing:8px;line-height:2.2}
.l{left:120px}.r{right:120px;text-align:right}
</style></head><body><div class="wrap"><div class="grid"></div>
<div class="pillars l">MINDSET<br>DISCIPLINE</div>
<div class="pillars r">RELATIONSHIPS<br>TACTICS</div>
<div class="center">
  <div class="word">
    <span>L</span>
    <svg width="132" height="179" viewBox="0 4 100 109">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9ff6e"/><stop offset="1" stop-color="#a8e51f"/></linearGradient></defs>
      <path d="M29 50 V34 a21 21 0 0 1 42 0 V50" fill="none" stroke="#f2f2f2" stroke-width="10"/>
      <rect x="12" y="46" width="76" height="66" rx="13" fill="url(#g)"/>
      <polygon points="50,58 67,77 57,77 57,99 43,99 43,77 33,77" fill="#0b0b0d"/>
    </svg>
    <span>CK</span><span class="gap"></span><span>IN</span>
  </div>
  <div class="rule"></div>
  <div class="tag">ONE IDEA A DAY TO <b>LEVEL UP</b></div>
</div>
</div></body></html>
